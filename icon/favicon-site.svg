<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond bleu aux coins arrondis (façon app mobile) -->
  <rect width="100" height="100" rx="22" fill="#3b82f6"/>
  
  <!-- Carrosserie du bus -->
  <rect x="20" y="25" width="60" height="45" rx="8" fill="#ffffff"/>
  
  <!-- Pare-brise -->
  <rect x="26" y="32" width="48" height="18" rx="4" fill="#3b82f6"/>
  
  <!-- Phares (légèrement jaunes) -->
  <circle cx="30" cy="60" r="4" fill="#fef08a"/>
  <circle cx="70" cy="60" r="4" fill="#fef08a"/>
  
  <!-- Calandre/Ligne design -->
  <rect x="42" y="60" width="16" height="3" rx="1.5" fill="#3b82f6"/>
  
  <!-- Roues -->
  <circle cx="32" cy="73" r="9" fill="#0f172a"/>
  <circle cx="68" cy="73" r="9" fill="#0f172a"/>
  
  <!-- Jantes -->
  <circle cx="32" cy="73" r="4" fill="#ffffff"/>
  <circle cx="68" cy="73" r="4" fill="#ffffff"/>
</svg>
