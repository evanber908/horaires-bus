<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mes Horaires Rémi 45</title>
  <link rel="icon" type="image/svg+xml" href="favicon-site.svg">
  <link rel="apple-touch-icon" href="favicon-site.svg">

  <!-- Typographie moderne : Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header class="app-header">
    <h1>🚍 Rémi 45</h1>
    <div id="status-box">Vérification...</div>
  </header>

  <main class="container">
    <!-- Panneau latéral sur ordinateur / En-tête sur mobile -->
    <aside class="left-panel">
      <!-- Card Prochain Bus -->
      <section class="card highlight-card">
        <h2>📍 Prochain Passage</h2>
        <div id="bus-result" class="bus-info">Recherche de l'arrêt le plus proche via GPS...</div>
      </section>

      <!-- Carte Leaflet -->
      <div class="map-wrapper">
        <button type="button" id="recenter-btn" class="recenter-btn">📍 Recentrer</button>
        <div id="map" class="map-container"></div>
      </div>
    </aside>

    <!-- Section Grille Horaire -->
    <section class="card" id="card-horaires">
      <h2>📅 Horaires du jour</h2>

      <div class="tabs-container" id="tabs"></div>

      <div class="search-wrapper">
        <input 
          type="text" 
          id="search-destination" 
          class="search-box" 
          placeholder="🔍 Filtrer par destination (ex : Orléans...)">
      </div>

      <div id="table-container"></div>

      <p class="source">
        Source : <a href="https://transport.data.gouv.fr/datasets/remi-offre-theorique-mobilite-reseau-interurbain-regional" target="_blank" rel="noopener">GTFS Rémi</a> (ODbL).
      </p>
    </section>
  </main>

</body>
</html>
